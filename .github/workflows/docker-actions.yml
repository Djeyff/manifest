name: Docker Actions

on:
  push:
    branches: [alphadev]
    paths:
      - "docker/actions/Dockerfile"
      - "packages/backend/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0-actions.1)"
        required: false
        type: string
  pull_request:
    branches: [main, alphadev]
    paths:
      - "docker/actions/Dockerfile"
      - "packages/backend/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"

permissions:
  contents: read

jobs:
  validate:
    name: Build actions image (validate)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/actions/Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Build & Publish actions image
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: djeyff/manifest-actions
          tags: |
            type=raw,value=alphadev
            type=sha
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: docker/actions/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
