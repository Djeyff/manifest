name: Docker

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "packages/backend/**"
      - "packages/shared/**"
      - "packages/frontend/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - ".github/workflows/docker.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (optional)"
        required: false
        type: string
  pull_request:
    branches: [main]
    paths:
      - "docker/**"
      - "packages/backend/**"
      - "packages/shared/**"
      - "packages/frontend/**"
      - "package.json"
      - "package-lock.json"
      - "turbo.json"
      - ".github/workflows/docker.yml"

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Build manifest image (validate)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Build & Publish manifest image
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/djeyff/manifest
          tags: |
            type=raw,value=latest
            type=sha
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
